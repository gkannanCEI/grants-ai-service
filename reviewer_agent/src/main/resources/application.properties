# =============================================================
# Server
# =============================================================
server.port=8080

# =============================================================
# LLM Model
#
# One property controls both the provider and the model.
# Format: [provider/]model-name
#
#   Gemini   → agent.model=gemini-2.0-flash
#   Ollama   → agent.model=ollama/llama3
#   OpenAI   → agent.model=openai/gpt-4o
#   Anthropic→ agent.model=anthropic/claude-3-5-sonnet
#
# API keys must be set as environment variables:
#   GOOGLE_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY
#
# For providers with a non-default base URL (Ollama, Azure, LM Studio):
#   agent.provider.base-url=http://localhost:11434
# =============================================================
agent.model=gemini-3.6-flash
agent.provider.base-url=
agent.provider.api-key=

# =============================================================
# Agent Identity
# =============================================================
agent.name=document-review-agent
agent.description=Autonomous agent that reads documents, scores them, and validates extracted data
agent.instruction=You are a document extraction agent. Your only job is:\
  \n1. When given a documentId (UUID), call 'readDocument' with that UUID to retrieve and return the document content.\
  \n2. When given an applicationId (e.g. APP-001), call 'readDocumentByApplicationId' with that applicationId to retrieve and return the document content.\
  \n3. Present the extracted text clearly to the user.\
  \nDo nothing else. Do not score, validate, or search vectors. Only read and return document content.

# =============================================================
# Context Management
# =============================================================
agent.context.max-turns=20
agent.context.include-system-summary=false

# =============================================================
# Vector Store — Milvus
# Set agent.vector.enabled=false to run without Milvus
#
# Dimension must match your embedding model:
#   gemini gemini-embedding-001  → 3072 (default), 1536, or 768 (truncatable)
#   ollama nomic-embed-text      → 768
#   openai text-embedding-3-sm   → 1536
# =============================================================
agent.vector.enabled=false
agent.vector.host=localhost
agent.vector.port=19530
agent.vector.collection=agent_documents
agent.vector.dimension=3072

# =============================================================
# Scoring Engine — set agent.scoring.enabled=true to activate
# Requires a running scoring service at agent.scoring.url
# =============================================================
agent.scoring.enabled=false
agent.scoring.url=http://localhost:8081/api/score
agent.scoring.timeout-seconds=30
agent.scoring.retry-attempts=2

# =============================================================
# File Upload Limits — prevent OOM on large uploads
# =============================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB

# =============================================================
# JVM Memory — picked up when launching via Maven (spring-boot:run)
# For IDE launches, set vmArgs in .vscode/launch.json instead.
# =============================================================
spring.jmx.enabled=false

# =============================================================
# Logging
# =============================================================
logging.level.com.example.agent=INFO
logging.level.com.google.adk=WARN
logging.level.io.milvus=WARN
