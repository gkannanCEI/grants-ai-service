# =============================================================
# Server
# =============================================================
server.port=8090

# =============================================================
# LLM Model
#
# One property controls both the provider and the model.
# Format: [provider/]model-name
#
#   Gemini   → agent.model=gemini-2.0-flash
#   Ollama   → agent.model=ollama/llama3
#   OpenAI   → agent.model=openai/gpt-4o
#   Anthropic→ agent.model=anthropic/claude-3-5-sonnet
#
# API keys must be set as environment variables:
#   GOOGLE_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY
#
# For providers with a non-default base URL (Ollama, Azure, LM Studio):
#   agent.provider.base-url=http://localhost:11434
# =============================================================
# -------------------------------------------------------------
# ONE-WORD PROVIDER SWITCH
# Change this single value to switch the whole stack (LLM model,
# embedding model, base URL, and vector dimension) between providers:
#
#   agent.provider.type=gemini   → Gemini LLM + Gemini embeddings (dim 3072)
#   agent.provider.type=ollama   → local Ollama LLM + Ollama embeddings (dim 768)
#
# Everything below has a per-provider default, so you normally only
# need to edit this one line. Any value you set explicitly still wins.
# -------------------------------------------------------------
agent.provider.type=gemini

# Optional explicit model. Leave BLANK to use the provider default:
#   gemini → gemini-3.6-flash        ollama → ollama/llama3
# Set it only to override the default for the selected provider.
agent.model=
#gemini-2.0-flash
#gemini-3.6-flash
#ollama/llama3

# Optional base URL. Leave BLANK to use the provider default:
#   gemini → Google endpoint         ollama → http://localhost:11434
agent.provider.base-url=
agent.provider.api-key=

# =============================================================
# Agent Identity
# =============================================================
agent.name=document-review-agent
agent.description=Autonomous agent that reads documents, scores them, and validates extracted data
agent.instruction=You are a document extraction agent. Your only job is:\
  \n1. When given a documentId (UUID), call 'readDocument' with that UUID to retrieve and return the document content.\
  \n2. When given an applicationId (e.g. APP-001), call 'readDocumentByApplicationId' with that applicationId to retrieve and return the document content.\
  \n3. Present the extracted text clearly to the user.\
  \nDo nothing else. Do not score, validate, or search vectors. Only read and return document content.

# =============================================================
# Context Management
# =============================================================
agent.context.max-turns=20
agent.context.include-system-summary=false

# =============================================================
# Primary Database — PostgreSQL
# Tracks every indexed document and its processing status
# (PENDING / PROCESSING / INDEXED / FAILED). Survives restarts,
# so the list endpoint and startup de-duplication are durable.
#
# Override via environment variables in production.
# =============================================================
spring.datasource.url=jdbc:postgresql://localhost:5435/grants_ai
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by Flyway migrations (src/main/resources/db/migration).
# Hibernate only validates that the entities match the migrated schema —
# it never creates or alters tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway — runs pending migrations at startup before Hibernate validation.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================================================
# Auto-ingest sources
# On startup the agent indexes documents from the configured
# source(s) — but only files/URLs that have not already been
# processed (tracked in Postgres by source + content hash).
#
#   agent.ingest.source-dir        Local directory; every document inside
#                                  (recursively) is read and indexed
#   agent.ingest.source-url        Single HTTP(S) URL returning document bytes
#   agent.ingest.application-id    Grouping/session key to file documents under
#   agent.ingest.enabled           Master switch for startup auto-ingest
#   agent.ingest.run-on-startup    Ingest at boot (false = manual trigger only)
#
# Both source-dir and source-url are optional and can be used together.
# Leave both blank to disable startup auto-ingest.
#
# Windows path example (escape backslashes):
#   agent.ingest.source-dir=D:\\FHLB-DM\\grants-ai-service\\documents
# =============================================================
agent.ingest.enabled=true
agent.ingest.run-on-startup=true
agent.ingest.source-dir=D:\\FHLB-DM\\document_collection
agent.ingest.source-url=
agent.ingest.application-id=APP-001

# =============================================================
# Vector Store — Milvus
# Set agent.vector.enabled=false to run without Milvus
#
# Dimension must match your embedding model:
#   gemini gemini-embedding-001  → 3072 (default), 1536, or 768 (truncatable)
#   ollama nomic-embed-text      → 768
#   openai text-embedding-3-sm   → 1536
# =============================================================
agent.vector.enabled=true
agent.vector.host=localhost
agent.vector.port=19530
agent.vector.collection=agent_documents
# Set to 0 (default) to auto-derive from agent.provider.type:
#   gemini → 3072    ollama → 768    openai → 1536
# Set a specific number to override. NOTE: after switching providers the
# dimension changes, so set agent.vector.recreate-on-startup=true ONCE,
# start the app to rebuild the collection, then set it back to false.
agent.vector.dimension=0

# Recreate (drop + rebuild) the Milvus collection on startup.
#   false (default) -> preserve indexed documents across restarts
#   true            -> drop everything and rebuild the schema on boot
# Set true ONCE after changing the embedding dimension or the collection
# schema (e.g. adding application_id), re-ingest your documents, then set
# it back to false so your data survives future restarts.
agent.vector.recreate-on-startup=true

# =============================================================
# Scoring Engine — set agent.scoring.enabled=true to activate
# Requires a running scoring service at agent.scoring.url
# =============================================================
agent.scoring.enabled=false
agent.scoring.url=http://localhost:8081/api/score
agent.scoring.timeout-seconds=30
agent.scoring.retry-attempts=2

# =============================================================
# File Upload Limits — prevent OOM on large uploads
# =============================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB

# =============================================================
# JVM Memory — picked up when launching via Maven (spring-boot:run)
# For IDE launches, set vmArgs in .vscode/launch.json instead.
# =============================================================
spring.jmx.enabled=false

# =============================================================
# Logging
# Configuration lives in log4j2-spring.xml (console + rolling files:
# app.log, error.log, debug.log, audit.log). Log levels, appenders and
# noise suppression (e.g. /DevMgmt scanner 404s) are all set there.
# =============================================================

# =============================================================
# OpenAPI / Swagger UI (springdoc)
#   OpenAPI JSON : http://localhost:8090/v3/api-docs
#   Swagger UI   : http://localhost:8090/swagger-ui.html
#
# The Swagger UI "Try it out" button sends real HTTP requests to the
# running application, so you can exercise the endpoints live.
# =============================================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
