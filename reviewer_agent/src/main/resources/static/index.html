<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Review Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Shell ── */
    .chat-shell {
      width: 100%;
      max-width: 820px;
      height: 92vh;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .chat-header {
      background: #1a73e8;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .chat-header .avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    .chat-header .info h1 { font-size: 15px; font-weight: 600; }
    .chat-header .info p  { font-size: 12px; opacity: 0.82; margin-top: 2px; }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4caf50;
      margin-left: auto;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.4);
    }

    /* ── Messages ── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 5px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 10px; }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 82%;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user  { align-self: flex-end;  flex-direction: row-reverse; }
    .msg-row.agent { align-self: flex-start; }

    .msg-icon {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }

    .msg-row.agent .msg-icon { background: #e8f0fe; }
    .msg-row.user  .msg-icon { background: #d2e3fc; }

    .bubble {
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      max-width: 100%;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .msg-row.agent .bubble { background: #f1f3f4; color: #202124; border-bottom-left-radius: 4px; }
    .msg-row.user  .bubble { background: #1a73e8; color: #fff;     border-bottom-right-radius: 4px; }

    .error-bubble { background: #fce8e6; color: #c5221f; }

    .msg-time { font-size: 10px; color: #9aa0a6; margin-top: 4px; padding: 0 4px; }

    /* ── Typing indicator ── */
    .typing-indicator {
      display: flex; align-items: center; gap: 4px;
      padding: 12px 16px;
      background: #f1f3f4;
      border-radius: 18px; border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .typing-indicator span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #9aa0a6; display: inline-block;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-6px); }
    }

    /* ── Welcome card ── */
    .welcome-card {
      background: #e8f0fe;
      border-radius: 12px;
      padding: 20px 24px;
      text-align: center;
      color: #3c4043;
      align-self: center;
      max-width: 500px;
    }

    .welcome-card h2 { font-size: 16px; color: #1a73e8; margin-bottom: 8px; }
    .welcome-card p  { font-size: 13px; line-height: 1.65; }

    /* ── Suggestion chips ── */
    .suggestions {
      padding: 0 20px 10px;
      display: flex; gap: 8px; flex-wrap: wrap;
      flex-shrink: 0;
    }

    .suggestion-chip {
      background: #e8f0fe; color: #1a73e8;
      border: none; border-radius: 16px;
      padding: 5px 13px; font-size: 13px;
      cursor: pointer; transition: background 0.15s;
    }

    .suggestion-chip:hover { background: #d2e3fc; }

    /* ── Bottom input area ── */
    .input-area {
      border-top: 1px solid #e8eaed;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      background: #fff;
    }

    /* Row 1: file + app id + status */
    .input-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .file-label {
      display: inline-flex; align-items: center; gap: 5px;
      background: #f1f3f4; color: #444;
      border: 1px solid #dadce0; border-radius: 8px;
      padding: 6px 12px; font-size: 13px;
      cursor: pointer; transition: background 0.15s;
      white-space: nowrap; flex-shrink: 0;
    }

    .file-label:hover { background: #e8eaed; }

    .file-label svg { flex-shrink: 0; }

    .app-id-input {
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      width: 170px;
      flex-shrink: 0;
      transition: border-color 0.15s;
    }

    .app-id-input:focus { border-color: #1a73e8; }
    .app-id-input::placeholder { color: #9aa0a6; }

    .file-status {
      font-size: 12px;
      color: #5f6368;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-status.ready { color: #1a73e8; font-weight: 500; }
    .file-status.error { color: #c5221f; }

    /* Row 2: text input + send button */
    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .input-row textarea {
      flex: 1;
      border: 1px solid #dadce0;
      border-radius: 24px;
      padding: 10px 18px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.5;
      transition: border-color 0.15s;
    }

    .input-row textarea:focus { border-color: #1a73e8; }
    .input-row textarea::placeholder { color: #9aa0a6; }

    .send-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #1a73e8; border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    .send-btn:hover   { background: #1557b0; }
    .send-btn:active  { transform: scale(0.93); }
    .send-btn:disabled { background: #dadce0; cursor: not-allowed; }
    .send-btn svg { fill: #fff; width: 20px; height: 20px; }
  </style>
</head>
<body>

<div class="chat-shell">

  <!-- Header -->
  <div class="chat-header">
    <div class="avatar">🤖</div>
    <div class="info">
      <h1>Document Review Agent</h1>
      <p>Upload · Extract · Read</p>
    </div>
    <div class="status-dot" title="Online"></div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chatMessages">
    <div class="welcome-card">
      <h2>Welcome 👋</h2>
      <p>Attach a document and enter an Application ID below,<br/>
         then click Send to extract and read it.</p>
    </div>
  </div>

  <!-- Suggestion chips -->
  <div class="suggestions" id="suggestions">
    <button class="suggestion-chip" onclick="sendSuggestion(this)">Read document {documentId}</button>
    <button class="suggestion-chip" onclick="sendSuggestion(this)">Read document for application {applicationId}</button>
  </div>

  <!-- Bottom input area -->
  <div class="input-area">

    <!-- Row 1: file picker + app id + status -->
    <div class="input-meta">
      <label class="file-label" for="fileInput">
        <svg viewBox="0 0 24 24" width="15" height="15">
          <path fill="currentColor" d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 0 0 5 0V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
        </svg>
        Attach file
      </label>
      <input type="file" id="fileInput" accept="*/*" style="display:none"
             onchange="onFileSelected(this)" />

      <input type="text" id="applicationIdInput" class="app-id-input"
             placeholder="Application ID" />

      <span id="fileStatus" class="file-status">No file selected</span>
    </div>

    <!-- Row 2: message text + send -->
    <div class="input-row">
      <textarea
        id="userInput"
        rows="1"
        placeholder="Type a message, or just click Send to extract the attached document…"
        aria-label="Message input"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>

  </div>
</div>

<script>
  const chatMessages = document.getElementById('chatMessages');
  const userInput    = document.getElementById('userInput');
  const sendBtn      = document.getElementById('sendBtn');
  const suggestions  = document.getElementById('suggestions');
  const fileStatus   = document.getElementById('fileStatus');

  const userId           = 'user-' + Math.random().toString(36).substring(2, 10);
  let   currentSessionId = null;
  let   pendingFile      = null; // file staged for upload on Send

  // ── File selected — stage it, don't upload yet ───────────────────────────
  function onFileSelected(input) {
    pendingFile = input.files[0] || null;
    if (pendingFile) {
      fileStatus.className   = 'file-status ready';
      fileStatus.textContent = `📎 ${pendingFile.name}`;
    } else {
      fileStatus.className   = 'file-status';
      fileStatus.textContent = 'No file selected';
    }
  }

  // ── Send — upload file (if any) then send message ────────────────────────
  async function sendMessage() {
    const text          = userInput.value.trim();
    const applicationId = document.getElementById('applicationIdInput').value.trim();

    // Must have either a file or a message
    if (!pendingFile && !text) return;

    suggestions.style.display = 'none';
    setLoading(true);

    // ── Step 1: upload document if one is staged ─────────────────────────
    let uploadedDoc = null;
    if (pendingFile) {
      const uploadLabel = pendingFile.name;
      appendMessage('user', `📎 ${uploadLabel}${applicationId ? '  |  App: ' + applicationId : ''}`);

      fileStatus.className   = 'file-status';
      fileStatus.textContent = `Uploading ${uploadLabel}…`;

      const formData = new FormData();
      formData.append('file', pendingFile);
      if (applicationId) formData.append('applicationId', applicationId);

      try {
        const res = await fetch('/api/documents/upload', { method: 'POST', body: formData });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ message: res.statusText }));
          fileStatus.className   = 'file-status error';
          fileStatus.textContent = `Upload failed: ${err.message}`;
          appendMessage('agent', `Upload failed: ${err.message}`, true);
          setLoading(false);
          return;
        }
        uploadedDoc = await res.json();

        fileStatus.className   = 'file-status ready';
        fileStatus.textContent = `✓ ${uploadLabel}`;

        // Update suggestion chips
        document.querySelectorAll('.suggestion-chip').forEach(chip => {
          chip.textContent = chip.textContent
            .replace('{documentId}',    uploadedDoc.documentId)
            .replace('{applicationId}', uploadedDoc.applicationId);
        });

        // Show upload confirmation in chat
        appendMessage('agent',
          `Document extracted and stored.\n` +
          `📄 File: ${uploadedDoc.fileName}\n` +
          `📋 Type: ${uploadedDoc.mimeType}\n` +
          `🏷️  Application ID: ${uploadedDoc.applicationId}\n` +
          `🆔 Document ID: ${uploadedDoc.documentId}`
        );

      } catch (err) {
        fileStatus.className   = 'file-status error';
        fileStatus.textContent = 'Upload failed';
        appendMessage('agent', 'Upload failed — is the server running?', true);
        setLoading(false);
        return;
      }

      // Clear staged file
      pendingFile = null;
      document.getElementById('fileInput').value = '';
    }

    // ── Step 2: send chat message if user typed one ───────────────────────
    // If no text but a file was uploaded, auto-ask the agent to read it
    let message = text;
    if (!message && uploadedDoc) {
      message = `Read document ${uploadedDoc.documentId}`;
    }

    if (message) {
      if (text) appendMessage('user', text);  // only show bubble for user-typed text
      userInput.value = '';
      userInput.style.height = 'auto';

      showTyping();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, sessionId: currentSessionId, message })
        });

        removeTyping();

        if (!res.ok) {
          const err = await res.json().catch(() => ({ message: res.statusText }));
          appendMessage('agent', `Error ${res.status}: ${err.message}`, true);
        } else {
          const data = await res.json();
          currentSessionId = data.sessionId;
          appendMessage('agent', data.response || '(no response)');
        }
      } catch (err) {
        removeTyping();
        appendMessage('agent', 'Could not reach the server. Is the Spring Boot app running?', true);
      }
    }

    setLoading(false);
    userInput.focus();
  }

  // ── Helpers ──────────────────────────────────────────────────────────────
  function sendSuggestion(btn) {
    userInput.value = btn.textContent;
    suggestions.style.display = 'none';
    sendMessage();
  }

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
  });

  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function appendMessage(role, text, isError = false) {
    const row    = document.createElement('div');
    row.className = `msg-row ${role}`;

    const icon    = document.createElement('div');
    icon.className = 'msg-icon';
    icon.textContent = role === 'user' ? '🧑' : '🤖';

    const inner  = document.createElement('div');
    const bubble = document.createElement('div');
    bubble.className  = isError ? 'bubble error-bubble' : 'bubble';
    bubble.textContent = text;

    const time = document.createElement('div');
    time.className  = 'msg-time';
    time.textContent = now();

    inner.appendChild(bubble);
    inner.appendChild(time);
    row.appendChild(icon);
    row.appendChild(inner);
    chatMessages.appendChild(row);
    scrollToBottom();
    return row;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row agent';
    row.id = 'typingRow';
    const icon = document.createElement('div');
    icon.className = 'msg-icon';
    icon.textContent = '🤖';
    const ind = document.createElement('div');
    ind.className = 'typing-indicator';
    ind.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(icon);
    row.appendChild(ind);
    chatMessages.appendChild(row);
    scrollToBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typingRow');
    if (el) el.remove();
  }

  function scrollToBottom() { chatMessages.scrollTop = chatMessages.scrollHeight; }

  function setLoading(on) {
    sendBtn.disabled   = on;
    userInput.disabled = on;
  }
</script>

</body>
</html>
